# À placer dans le repo à : .github/workflows/scrape-events.yml
name: Scrape événements Toulouse

on:
  schedule:
    # Tous les jours à 6h05 heure de Paris (été, UTC+2) -> 4h05 UTC
    - cron: "5 4 * * *"
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour committer le JSON mis à jour

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Lancer le scraper
        run: python scraper.py

      - name: Committer le JSON mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events-brocantes.json
          git diff --quiet --cached || git commit -m "Mise à jour des événements ($(date -u +%Y-%m-%d))"
          git push
